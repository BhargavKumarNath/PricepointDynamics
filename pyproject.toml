[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pricepoint-dynamics"
version = "1.0.0"
description = "UK supermarket competitive intelligence pipeline — ingestion, semantic product matching, feature engineering, price prediction, and market analysis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Bhargav Kumar Nath" }]

dependencies = [
    "pandas",
    "numpy<2",
    "polars",
    "pyyaml",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandera",
    "typer",
    "psutil",
    "joblib",
    "duckdb",
    "pyarrow",
    "scikit-learn",
    "lightgbm",
    "shap",
    "sentence-transformers",
    "faiss-cpu",
    "requests",
    # Dashboard (Streamlit) runtime — kept in the same install as the core
    # pipeline for now since dashboard/ and pricepoint/ are still deployed
    # together; split into a separate optional group if/when the dashboard
    # is decoupled from the core package (see project_refactor.md §9).
    "streamlit",
    "streamlit-agraph",
    "matplotlib",
    "seaborn",
    "gdown",
    # API (Phase 4) — FastAPI service, api/. httpx is required by
    # starlette's TestClient (not just a test-only convenience), so it's a
    # main dependency, not confined to the dev group.
    "fastapi",
    "uvicorn[standard]",
    "slowapi",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "detect-secrets",
    "types-PyYAML",
]
# Only needed for scripts/download_raw_data.py, a one-off acquisition
# utility outside the core pipeline -- kept out of the main dependency
# list so a plain `uv sync`/`pip install -e .` doesn't pull in a package
# nothing else in src/pricepoint imports. Install with
# `uv sync --extra kaggle` or `pip install -e ".[kaggle]"`.
kaggle = [
    "kaggle",
]
# Only needed to build/serve the docs/ site locally (`mkdocs serve`) or in
# the docs-deploy CI job -- kept out of the main dependency list for the
# same reason as the kaggle extra above. Install with
# `uv sync --extra docs` or `pip install -e ".[docs]"`.
docs = [
    "mkdocs-material",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pricepoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# api/ lives at the repo root (sibling to src/, not inside src/pricepoint/
# -- see project_refactor.md §4), so it is not installed as part of the
# wheel and needs the repo root on sys.path for `from api...` imports in
# tests/api/ to resolve regardless of the invocation directory.
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
# dashboard/ (Streamlit UI: long literal dicts, HTML/markdown strings) and
# notebooks/ (narrative EDA, not yet thinned per project_refactor.md §19
# Phase 1+) are deliberately excluded from Phase 0's lint gate -- neither
# was touched for src/-layout packaging, and holding untouched
# presentation/exploratory code to the same bar as src/pricepoint here
# would be scope creep beyond "zero business-logic changes". Revisit this
# exclusion explicitly once either area is in scope for a phase.
extend-exclude = ["dashboard", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008 (no function calls in argument defaults) generically flags
# `Depends(...)` as an anti-pattern, but it's FastAPI's own required
# dependency-injection idiom -- evaluated once per request by FastAPI
# itself, not at function-definition time like a mutable-default bug.
"api/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
