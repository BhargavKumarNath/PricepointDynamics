name: API Keep-Alive

# Pings the deployed Cloud Run API's health check every ~10 minutes to
# keep it warm under Cloud Run's request-processing-time billing model
# (docs/deployment.md, project_refactor.md §25.6/§25.9) -- avoids a real
# cold start on the next genuine user request, at near-zero cost (a
# `GET /health` request every 10 min is nowhere near Cloud Run's free
# request quota).
#
# Dormant until the `API_HEALTH_URL` repository variable is set
# (Settings -> Secrets and variables -> Actions -> Variables -> New
# repository variable, e.g. https://pricepoint-api-xxxxx.a.run.app/health)
# -- the job intentionally no-ops with a clear message rather than failing
# CI on every scheduled run before a real deployment exists.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    steps:
      - name: Ping deployed API
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          if [ -z "$API_HEALTH_URL" ]; then
            echo "API_HEALTH_URL repository variable not set -- nothing deployed yet. Skipping."
            exit 0
          fi
          # 10s was too tight: a genuine Cloud Run cold start (loading
          # pandas/numpy/lightgbm/duckdb from scratch) can take longer than
          # that, which made this job fail on exactly the scenario it
          # exists to prevent (observed: exit 28, curl timeout, 2026-08-21).
          # --retry handles a single slow-starting instance without
          # spuriously failing CI; the retry's own request is also what
          # finishes warming the instance up.
          curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 5 "$API_HEALTH_URL"
